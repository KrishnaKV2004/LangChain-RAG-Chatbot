# Two services from one image: the API and the Streamlit UI.
#
#   cp .env.example .env && edit it        # secrets
#   docker compose up --build              # start
#   docker compose run --rm api python -m app.cli rebuild   # index documents
#
services:
  api:
    build: .
    image: rag-agent
    env_file: .env
    environment:
      # Container paths for the two things that MUST outlive a restart.
      VECTOR_STORE__PERSIST_DIRECTORY: /app/data/chroma
      CACHE__PATH: /app/data/cache
      PATHS__DOCUMENTS_DIR: /app/documents
      # Structured logs for aggregators.
      LOGGING__JSON_FORMAT: "true"
    ports:
      - "8000:8000"
    volumes:
      # The index. Rebuilding it is expensive, so keep it.
      - chroma:/app/data/chroma
      # Holds the 7LFreight JWT. Losing this burns a login from the DAILY
      # quota on every restart — the single most important volume here.
      - cache:/app/data/cache
      # Writable: /upload drops new files here before indexing.
      - ./documents:/app/documents
    restart: unless-stopped

  ui:
    build: .
    image: rag-agent
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      # The UI is an HTTP client only — it never imports app code.
      RAG_API_URL: http://api:8000
      RAG_API_TOKEN: ${API__AUTH_TOKEN:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        # Wait for the models to finish loading, not just for the port to open.
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma:
  cache:
